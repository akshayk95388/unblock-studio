name: Daily Marketing Video Generation

on:
  schedule:
    # Run every morning at 08:00 UTC
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  render-and-post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install FFmpeg & Chromium Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Project Dependencies
        run: npm ci

      - name: Execute Daily Audio & Video Batch Pipeline
        env:
          UNBLOCK_FOCUS_API_URL: ${{ secrets.UNBLOCK_FOCUS_API_URL }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          npx tsx scripts/scheduled-batch.ts
          npx tsx scripts/render-video.ts

      - name: Upload Generated Videos Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-reels-mp4
          path: output/*.mp4
